# ============================================================================
# render.yaml — Blueprint do FuuDelivery no Render
# ============================================================================
# ESTADO REAL DA CONTA (auditado 2026-08-23 via API):
#   - 3 serviços ativos: fuudelivery-api, fuudelivery-web, fuudelivery-admin
#   - Redis NÃO é gerenciado pelo Render — REDIS_URL aponta para provedor
#     externo (*.db.redis.io). O antigo bloco `type: redis` foi REMOVIDO deste
#     arquivo porque não existe mais na conta; mantê-lo faria o blueprint
#     criar um Redis duplicado num próximo apply.
#
# CONVENÇÃO DE NOMES (não renomear sem coordenação — URLs mudam):
#   - Todos os serviços usam o prefixo "fuudelivery-".
#   - As URLs onrender.com estão gravadas em código (apps mobile compilados,
#     frontends, CORS) e em references/URLS.md. Renomear = quebrar clientes.
#
# SECRETS (sync: false): preenchidos no dashboard Render → Environment.
# Nunca commitar valores aqui.
# ============================================================================

services:
  # ============================================================
  # API — Monolito Go (auth + orders + delivery + chat + payment)
  # URL: https://fuudelivery-api-8y6l.onrender.com
  # ============================================================
  - type: web
    name: fuudelivery-api
    env: go
    buildCommand: cd cmd/fuudelivery && GOWORK=off go mod tidy && go build -o ../../server .
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      # ── Infra básica ──────────────────────────────────────
      - key: PORT
        value: "3000"
      - key: GO_VERSION
        # Pinado em 1.25.x: "stable" já resolveu Go 1.27 e quebrou pgx/govulncheck
        # uma vez (ver ci.yml, que usa o mesmo pin por esse motivo).
        value: "1.25.x"
      - key: GO_ENV
        value: production

      # ── Banco de dados / cache ────────────────────────────
      # Postgres (Supabase). MongoDB foi removido (2026-08-27).
      - key: DB_CONNECTION_STRING
        sync: false
      # Redis EXTERNO (não é serviço Render). Valor real no dashboard.
      - key: REDIS_URL
        sync: false

      # ── Autenticação / pagamentos (secrets) ───────────────
      - key: JWT_SECRET
        sync: false
      - key: ABACATE_PAY_API_KEY
        sync: false
      - key: ABACATE_PAY_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Bootstrap do primeiro admin ───────────────────────
      # POST /admin/bootstrap exige este secret. Uso único: criar o admin,
      # confirmar, e remover a variável do dashboard depois.
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false

      # ── Observabilidade / rotas ───────────────────────────
      # Protege GET /metrics (Bearer ou ?token=). Vazio = público.
      - key: METRICS_TOKEN
        sync: false
      # Servidor OSRM próprio p/ cálculo de rotas. Vazio = demo público (só dev).
      - key: OSRM_BASE_URL
        sync: false

      # ── URLs da aplicação ─────────────────────────────────
      # ⚠️ Sufixo -8y6l hardcoded: se o serviço for recriado, atualize aqui,
      #    ALLOWED_ORIGINS, config/api.ts dos apps mobile e os frontends.
      - key: APP_URL
        value: "https://fuudelivery-web.onrender.com"
      - key: API_BASE_URL
        value: "https://fuudelivery-api-8y6l.onrender.com"
      - key: ALLOWED_ORIGINS
        value: "https://fuudelivery-web.onrender.com,https://fuudelivery-admin-lv7f.onrender.com"

  # ============================================================
  # WEB — Painel do Restaurante (Vite + React 19 + Tailwind 4)
  # URL: https://fuudelivery-web.onrender.com
  # ============================================================
  - type: web
    name: fuudelivery-web
    env: static
    buildCommand: cd Frontend/WebRestaurant && npm install && npm run build
    staticPublishPath: Frontend/WebRestaurant/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://fuudelivery-api-8y6l.onrender.com

  # ============================================================
  # ADMIN — Painel Administrativo (Vite + React 19 + Tailwind 4)
  # URL: https://fuudelivery-admin-lv7f.onrender.com
  # ============================================================
  - type: web
    name: fuudelivery-admin
    env: static
    buildCommand: cd Frontend/WebAdmin && npm install --legacy-peer-deps && npm run build
    staticPublishPath: Frontend/WebAdmin/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://fuudelivery-api-8y6l.onrender.com

# ============================================================================
# NOTA SOBRE REDIS EXTERNO
# ============================================================================
# O REDIS_URL aponta para um Redis externo (*.db.redis.io), não gerenciado
# pelo Render. Se um dia migrar para o Redis gerenciado do Render, crie o
# serviço no dashboard e troque o valor de REDIS_URL — NÃO re-adicione um
# bloco `type: redis` aqui sem antes verificar o plano (free tem eviction
# allkeys-lru: mensagens da fila de pagamentos podem ser perdidas).
# ============================================================================
