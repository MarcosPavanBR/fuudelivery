name: Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Build AppComida (client APK)
  # ──────────────────────────────────────────────
  build-appcomida:
    name: Build AppComida
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/AppComida

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/AppComida/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          echo "$OUTPUT" > build-output.json
          BUILD_ID=$(echo "$OUTPUT" | jq -r '.id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "ERROR: Failed to extract build ID from EAS output"
            echo "$OUTPUT"
            exit 1
          fi
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          echo "Downloading build $BUILD_ID"
          mkdir -p artifacts
          eas build:download --id "$BUILD_ID" --platform android --path ./artifacts
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcomida-apk
          path: Frontend/AppComida/artifacts/*.apk
          retention-days: 5

  # ──────────────────────────────────────────────
  # Build AppEntrega (delivery driver APK)
  # ──────────────────────────────────────────────
  build-appentrega:
    name: Build AppEntrega
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/AppEntrega

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/AppEntrega/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          echo "$OUTPUT" > build-output.json
          BUILD_ID=$(echo "$OUTPUT" | jq -r '.id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "ERROR: Failed to extract build ID from EAS output"
            echo "$OUTPUT"
            exit 1
          fi
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          echo "Downloading build $BUILD_ID"
          mkdir -p artifacts
          eas build:download --id "$BUILD_ID" --platform android --path ./artifacts
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appentrega-apk
          path: Frontend/AppEntrega/artifacts/*.apk
          retention-days: 5

  # ──────────────────────────────────────────────
  # Create GitHub Release with both APKs
  # ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-appcomida, build-appentrega]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: Download both APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify APKs downloaded
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "=== Count ==="
          APK_COUNT=$(find artifacts -type f -name "*.apk" | wc -l)
          echo "APK files found: $APK_COUNT"
          if [ "$APK_COUNT" -lt 2 ]; then
            echo "ERROR: Expected 2 APK files, found $APK_COUNT"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} — FuuDelivery"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          files: |
            artifacts/appcomida-apk/*.apk
            artifacts/appentrega-apk/*.apk
          body: |
            ## 📱 APKs

            | App | Description | File |
            |-----|-------------|------|
            | **FuuDelivery** | App do cliente (fazer pedidos) | `appcomida-apk/*.apk` |
            | **FuuEntrega** | App do entregador (receber entregas) | `appentrega-apk/*.apk` |

            ## 📦 Installation

            1. Download the `.apk` file for your role
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK file to install

            ## 🔗 Links

            - **API (Monolito):** https://fuudelivery-api-8y6l.onrender.com
            - **WebRestaurant:** https://fuudelivery-web.onrender.com
            - **WebAdmin:** https://fuudelivery-admin-lv7f.onrender.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
