services:
  # ============================================================
  # MONOLITH — API Gateway (Go + Fiber)
  # Unifica auth_api, orders_api, delivery_api, chat_api, payment_api
  # ============================================================
  - type: web
    name: fuudelivery-api
    env: go
    buildCommand: cd cmd/fuudelivery && go build -o ../../server .
    startCommand: ./server
    envVars:
      - key: PORT
        value: "3000"
      - key: GO_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ABACATE_PAY_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: fuudelivery-redis
          property: connectionString
      - key: DB_CONNECTION_STRING
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: "fuudelivery"
      - key: APP_URL
        value: "https://fuudelivery-web.onrender.com"
      - key: API_BASE_URL
        value: "https://fuudelivery-api.onrender.com"
      - key: ABACATE_PAY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://fuudelivery-web.onrender.com,https://fuudelivery-admin-lv7f.onrender.com,https://fuudelivery-payment-panel.onrender.com"
    healthCheckPath: /health

  # ============================================================
  # WEB — Frontend do Restaurante (React)
  # ============================================================
  - type: web
    name: fuudelivery-web
    env: static
    buildCommand: cd Frontend/WebRestaurant && npm install && npm run build
    staticPublishPath: Frontend/WebRestaurant/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://fuudelivery-api.onrender.com

  # ============================================================
  # ADMIN — Painel Administrativo (React)
  # ============================================================
  - type: web
    name: fuudelivery-admin
    env: static
    buildCommand: cd Frontend/WebAdmin && npm install --legacy-peer-deps && npm run build
    staticPublishPath: Frontend/WebAdmin/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://fuudelivery-api.onrender.com

  # ============================================================
  # REDIS — Cache + Fila de pagamentos (BRPop)
  # ============================================================
  - type: redis
    name: fuudelivery-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # ============================================================
  # PAYMENT SERVICE — Microserviço isolado de pagamentos
  # ============================================================
  - type: web
    name: fuudelivery-payment
    env: go
    buildCommand: cd Backend/Payment && go build -o ../../server .
    startCommand: ./server
    envVars:
      - key: PORT
        value: "8084"
      - key: MONGO_URI
        sync: false
      - key: PAYMENT_MONGO_DATABASE
        value: "fuudelivery_payments"
      - key: REDIS_URL
        fromService:
          type: redis
          name: fuudelivery-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ABACATE_PAY_API_KEY
        sync: false
      - key: ABACATE_PAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://fuudelivery-web.onrender.com,https://fuudelivery-admin-lv7f.onrender.com,https://fuudelivery-payment-panel.onrender.com"
    healthCheckPath: /health

  # ============================================================
  # PAYMENT PANEL — Frontend do Payment Service (React)
  # ============================================================
  - type: web
    name: fuudelivery-payment-panel
    env: static
    buildCommand: cd Frontend/PaymentPanel && npm install && npm run build
    staticPublishPath: Frontend/PaymentPanel/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
