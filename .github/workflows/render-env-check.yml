name: Render Env Check (temp2)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-env-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump raw response
        env:
          RKEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $RKEY" \
            "https://api.render.com/v1/services/srv-d9e55qf41pts73e8q8dg/env-vars" > /tmp/envs.json
          echo "bytes: $(wc -c < /tmp/envs.json)"
          echo "--- raw head ---"
          head -c 2000 /tmp/envs.json
          echo
          echo "--- python parse ---"
          python3 - <<'PYEOF'
          import json
          try:
              data = json.load(open('/tmp/envs.json'))
              print('type:', type(data).__name__)
              if isinstance(data, dict):
                  print('keys:', list(data.keys())[:20])
              elif isinstance(data, list):
                  print('len:', len(data))
                  if data:
                      print('item0 keys:', list(data[0].keys())[:20])
          except Exception as e:
              print('parse error:', e)
          PYEOF
