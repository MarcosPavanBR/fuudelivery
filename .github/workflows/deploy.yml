name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  # Gate: só permite deploy se o CI Gate passou (ou em disparo manual).
  # Este job SEMPRE roda; se o CI falhou, falha o pipeline e bloqueia o deploy.
  check-ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica resultado do CI Gate
        if: ${{ github.event_name != 'workflow_dispatch' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI workflow did not pass (conclusion: ${{ github.event.workflow_run.conclusion }})."
          echo "Fix CI failures before deploying."
          exit 1

  deploy-all:
    needs: [check-ci-status]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api
            service_id_secret: RENDER_SERVICE_ID_API
          - name: web
            service_id_secret: RENDER_SERVICE_ID_WEB
          - name: admin
            service_id_secret: RENDER_SERVICE_ID_ADMIN
    steps:
      - name: Garante rotas SPA (web/admin) antes do deploy
        if: matrix.service.name != 'api'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets[matrix.service.service_id_secret] }}
        run: |
          # O deploy via API (POST /deploys) nao sincroniza config de servico.
          # Garante o rewrite SPA (/* -> /index.html) antes de rebuildar,
          # para as rotas nunca ficarem dessincronizadas do render.yaml.
          curl -sS -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '[{"type":"rewrite","source":"/*","destination":"/index.html"}]' \
            -w "\nHTTP %{http_code}\n" \
            "https://api.render.com/v1/services/${SERVICE_ID}/routes"

      - name: Deploy ${{ matrix.service.name }} to Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets[matrix.service.service_id_secret] }}/deploys"
