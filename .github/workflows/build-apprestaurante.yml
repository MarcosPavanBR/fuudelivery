name: Build AppRestaurante APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frontend/AppRestaurante/**'
      - '.github/workflows/build-apprestaurante.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/AppRestaurante

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/AppRestaurante/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild (gera projeto nativo)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EX_UPDATES_CHANNEL: preview

      - name: Build APK (Gradle)
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppRestaurante-APK
          path: Frontend/AppRestaurante/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
