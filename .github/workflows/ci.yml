name: CI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────
  # Go modules — matrix strategy
  # ──────────────────────────────────────────────
  go-modules:
    name: Go — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # FIXADO: "stable" passou a resolver Go 1.27 e quebrou pgx
          # (connection reset) + govulncheck v1.1.4. Alinhar com go.work/go.mod.
          go-version: "1.25.x"

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 60s

  # ──────────────────────────────────────────────
  # Integration — fluxo completo de pagamento PIX
  # (exige Docker: MongoDB + Postgres via "docker run"; AbacatePay mockado
  #  por httptest.Server)
  # ──────────────────────────────────────────────
  integration-payments:
    name: Integration — fluxo PIX (auth→order→payment→split→wallet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/fuudelivery
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # FIXADO: "stable" passou a resolver Go 1.27 e quebrou pgx
          # (connection reset) + govulncheck v1.1.4. Alinhar com go.work/go.mod.
          go-version: "1.25.x"

      - name: Start Docker services (Mongo + Postgres)
        # Mesmo padrão do job e2e-delivery (que passa estável no runner
        # atual): "docker run" cru + wait via mongosh/pg_isready. O teste
        # detecta MONGO_TEST_URI/POSTGRES_TEST_URI e conecta direto,
        # pulando o testcontainers.
        run: |
          # Mongo com credenciais root test:test (o driver autentica via authSource=admin).
          docker run -d --name mongo-it -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=test -e MONGO_INITDB_ROOT_PASSWORD=test mongo:7
          docker run -d --name pg-it -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=fuudelivery_staging postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec mongo-it mongosh --eval 'db.runCommand("ping")' --quiet >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Espera o Postgres TERMINAR de vez o initdb com espera real (until +
          # sleep 1): durante o setup ele reinicia e recusa conexões, e 30
          # tentativas sem sleep passam em ~2s, antes do servidor estar pronto.
          # `until`/`if` são imunes a errexit (bash -e do GitHub Actions).
          until docker exec pg-it psql -U test -d postgres -c 'SELECT 1' >/dev/null 2>&1; do sleep 1; done
          # Uma database por suíte — antes cada teste tinha o próprio container,
          # então rodar tudo na mesma database causaria interferência de dados.
          # Retry: pode ainda pegar a cauda do reinício do initdb.
          for i in $(seq 1 30); do
            if docker exec pg-it psql -U test -d postgres \
              -c "CREATE DATABASE it_fullflow" -c "CREATE DATABASE it_err_scenarios" -c "CREATE DATABASE it_admin_bootstrap"; then break; fi
            sleep 2
          done
          echo "Services ready."

      # Cada suíte roda isolada (database própria), replicando o isolamento
      # que os containers individuais garantiam antes do escape hatch.
      - name: Run TestFullFlow
        env:
          MONGO_TEST_URI: mongodb://test:test@localhost:27017/fuudelivery_test?directConnection=true&authSource=admin
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/it_fullflow?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 10m -run 'TestFullFlow' ./

      - name: Run TestErrorScenarios
        env:
          MONGO_TEST_URI: mongodb://test:test@localhost:27017/fuudelivery_err_test?directConnection=true&authSource=admin
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/it_err_scenarios?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 10m -run 'TestErrorScenarios' ./

      - name: Run TestAdminBootstrap
        env:
          MONGO_TEST_URI: mongodb://test:test@localhost:27017/fuudelivery_bootstrap?directConnection=true&authSource=admin
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/it_admin_bootstrap?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 10m -run 'TestAdminBootstrap' ./

      - name: Cleanup Docker services
        if: always()
        run: docker rm -f mongo-it pg-it 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Integration — payment_api (checkout E2E + admin Financeiro)
  # (exige Docker: Postgres via "docker run")
  # ──────────────────────────────────────────────
  integration-payment-api:
    name: Integration — payment_api (checkout + admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/payment_api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # FIXADO: "stable" passou a resolver Go 1.27 e quebrou pgx
          # (connection reset) + govulncheck v1.1.4. Alinhar com go.work/go.mod.
          go-version: "1.25.x"

      - name: Start Docker service (Postgres)
        # Mesmo padrão comprovado do job e2e-delivery: "docker run" cru +
        # pg_isready. O teste detecta POSTGRES_TEST_URI e conecta direto.
        run: |
          docker run -d --name pg-pay -p 5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=payment_e2e_test postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg-pay pg_isready -U test 2>/dev/null && break
            sleep 1
          done
          echo "Service ready."

      - name: Run payment_api integration tests
        env:
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/payment_e2e_test?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 20m -run 'TestCheckoutE2E' ./app/handlers/

      - name: Cleanup Docker services
        if: always()
        run: docker rm -f pg-pay 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Formatting — all Go modules
  # ──────────────────────────────────────────────
  lint:
    name: Lint — gofmt (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # FIXADO: "stable" passou a resolver Go 1.27 e quebrou pgx
          # (connection reset) + govulncheck v1.1.4. Alinhar com go.work/go.mod.
          go-version: "1.25.x"

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l -s Backend/ cmd/)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Vulnerability scanning — all Go modules
  # ──────────────────────────────────────────────
  govulncheck:
    name: govulncheck — ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # FIXADO: "stable" passou a resolver Go 1.27 e quebrou pgx
          # (connection reset) + govulncheck v1.1.4. Alinhar com go.work/go.mod.
          go-version: "1.25.x"

      - name: Install govulncheck
        # v1.1.4 compativel com Go 1.24+ (v1.2.0+ exige go >= 1.25)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # Mobile — API URL consistency (URLS.md vs config/api.ts)
  # ──────────────────────────────────────────────
  check-mobile-urls:
    name: Check mobile API URL consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run URL consistency check
        run: bash scripts/check-mobile-urls.sh

  # --------------------------------------------------------------
  # Regressao - regras CSS fora de @layer (bug do Tailwind v4)
  # No Tailwind v4, regra sem layer sempre vence qualquer layer,
  # anulando utilities (p-6, lg:ml-64...). Este job impede a volta
  # em TODOS os CSS customizados do repo (scan automático).
  # --------------------------------------------------------------
  check-css-layers:
    name: Check CSS @layer (no unlayered rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run checker unit test
        run: node scripts/check-unlayered-css.test.cjs

      - name: Run unlayered CSS check
        run: node scripts/check-unlayered-css.cjs

  # ──────────────────────────────────────────────
  # Workflows — YAML válido + sintaxe bash dos run blocks
  # ──────────────────────────────────────────────
  check-workflows:
    name: Check workflow YAML + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run checker self-test
        run: python3 scripts/check-workflows.py --self-test

      - name: Validate all workflow files + script refs
        run: python3 scripts/check-workflows.py --repo-root .

  # ──────────────────────────────────────────────
  # Frontend — install, test, lint, build
  # ──────────────────────────────────────────────
  frontend-webrestaurant:
    name: Frontend — WebRestaurant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/WebRestaurant
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/WebRestaurant/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # vitest (substitui react-scripts test após a migração webpack → Vite)
        run: npm test

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # NPM Audit — all frontends
  # ──────────────────────────────────────────────
  npm-audit:
    name: NPM Audit — ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - Frontend/WebRestaurant
          - Frontend/WebAdmin
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        # --omit=dev ignora devDependencies; --audit-level=critical so falha
        # em vulnerabilidades criticas (moderate/high sao reportadas mas nao bloqueiam)
        run: npm audit --omit=dev --audit-level=critical

  # ──────────────────────────────────────────────
  # Shell scripts — portabilidade + bugs comuns
  # ──────────────────────────────────────────────
  check-shellcheck:
    name: ShellCheck — scripts .sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run ShellCheck on all .sh scripts
        # -S warning: bloqueia warnings e errors, ignora style/info.
        # --exclude=SC1091: sourcing de arquivos externos (e.g. .env)
        #   nao e verificavel no CI sem o target real.
        run: |
          scripts=$(find scripts sql -name '*.sh' -type f 2>/dev/null || true)
          if [ -z "$scripts" ]; then
            echo "No .sh files found, skipping."
            exit 0
          fi
          echo "Checking: $scripts"
          shellcheck -S warning --exclude=SC1091 $scripts

  # ──────────────────────────────────────────────
  # Delivery E2E — dual-write PG+Mongo via testcontainers
  # ──────────────────────────────────────────────
  e2e-delivery:
    name: E2E — Delivery (dual-write)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: cmd/fuudelivery/go.sum

      - name: Start Docker services (Mongo + Postgres)
        run: |
          docker run -d --name mongo-e2e -p 27017:27017 mongo:7
          docker run -d --name pg-e2e -p 5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=fuudelivery_delivery postgres:16-alpine
          # Wait for both to be ready
          for i in $(seq 1 30); do
            docker exec mongo-e2e mongosh --eval 'db.runCommand("ping")' --quiet 2>/dev/null && break
            sleep 1
          done
          for i in $(seq 1 30); do
            docker exec pg-e2e pg_isready -U test 2>/dev/null && break
            sleep 1
          done
          echo "Services ready."

      - name: Run Delivery E2E tests
        working-directory: cmd/fuudelivery
        run: |
          go test -tags=integration -v -count=1 -timeout=5m \
            -run 'TestDeliveryLifecycle|TestDeliverySolicitationsDualWrite' \
            .

      - name: Cleanup Docker services
        if: always()
        run: docker rm -f mongo-e2e pg-e2e 2>/dev/null || true
