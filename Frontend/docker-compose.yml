## Para pegar as credenciais acesse e crie um cadastro em https://expo.dev
x-common-variables: &common-variables
  API_BASE_URL: http://192.168.100.142
  EXPO_QR_GEN: 192.168.100.142
  EXPO_USERNAME:  ## ADICIONE SEU USERNAME DO EXPO
  EXPO_PASSWORD:  ## ADICIONE SUA SENHA DO EXPO

services:
  expo-app-entrega:
    container_name: app-entrega
    build:
      context: ./AppEntrega
      args:
        EXPO_USERNAME: ${EXPO_USERNAME}
        EXPO_PASSWORD: ${EXPO_PASSWORD}
    ports:
      - "19001:19001"
    volumes:
      - ./AppEntrega:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      <<: *common-variables

  expo-app-comida:
    container_name: app-comida
    build:
      context: ./AppComida
      args:
        EXPO_USERNAME: ${EXPO_USERNAME}
        EXPO_PASSWORD: ${EXPO_PASSWORD}
    ports:
      - "19002:19002"
    volumes:
      - ./AppComida:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      <<: *common-variables
    depends_on:
      - expo-app-entrega

  web-restaurant:
    container_name: web-restaurant
    build: ./WebRestaurant
    volumes:
      - ./WebRestaurant:/app
      - /app/node_modules
    working_dir: /app
    ports:
      - "3000:8080"
    environment:
      <<: *common-variables
