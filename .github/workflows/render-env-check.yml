name: Fetch Render logs (temp)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-env-check.yml'
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch recent logs
        env:
          RKEY: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ secrets.RENDER_SERVICE_ID_API }}
        run: |
          curl -s -H "Authorization: Bearer $RKEY" \
            "https://api.render.com/v1/services/$SID/logs?limit=300" > /tmp/logs.txt
          echo "bytes: $(wc -c < /tmp/logs.txt)"
          echo "--- raw head ---"
          head -c 500 /tmp/logs.txt
          echo
          echo "--- filtered lines ---"
          grep -iE 'pix|abacate|failed|error|charge' /tmp/logs.txt | tail -25 || echo "(nada filtrado)"
