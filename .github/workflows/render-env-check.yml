name: Render Env Check (temp)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-env-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch API service env vars
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/srv-d9e55qf41pts73e8q8dg/env-vars" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
keys = ['MONGO_URI','PAYMENT_MONGO_DATABASE','MONGO_DATABASE','MONGO_DB','ABACATE_PAY_API_KEY','JWT_SECRET']
for e in data:
    k = e.get('envVarKey','')
    if k in keys:
        v = e.get('value','')
        if k in ('MONGO_URI','ABACATE_PAY_API_KEY','JWT_SECRET'):
            print(k, '=', (v[:25] + '...') if len(v)>25 else '***short***')
        else:
            print(k, '=', v)
"
