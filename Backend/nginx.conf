events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # Security: hide nginx version
    server_tokens off;

    # Timeouts
    client_body_timeout 30;
    client_header_timeout 30;
    keepalive_timeout 30 30;
    send_timeout 30;

    # Body size
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain;

    # Upstream definitions
    upstream auth_api { server auth-api:3000; }
    upstream orders_api { server orders-api:3000; }
    upstream delivery_api { server delivery-api:3000; }
    upstream payment_api { server payment-api:3000; }
    upstream chat_api { server chat-api:3000; }

    server {
        listen 80;

        # ===== CORS preflight global handler =====
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://fuudelivery-web.onrender.com,https://fuudelivery-admin-lv7f.onrender.com' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0 always;
                add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
                return 204;
            }
        }

        # ===== Security headers =====
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Shared CORS function via map
        map $http_origin $cors_origin {
            default "";
            "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "$http_origin";
            "~^https://fuudelivery-web\.onrender\.com$" "$http_origin";
            "~^https://fuudelivery-admin-lv7f\.onrender\.com$" "$http_origin";
            "~^https://fuudelivery-payment-panel\.onrender\.com$" "$http_origin";
        }

        # ===== Auth API (no JWT required for login/register) =====
        location /api/auth/ {
            proxy_pass http://auth_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }

        # ===== Orders API (JWT required) =====
        location /api/order/ {
            proxy_pass http://orders_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # JWT authentication via Lua
            access_by_lua_file /etc/nginx/jwt-auth.lua;

            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }

        # ===== Chat API (WebSocket + JWT) =====
        location /api/chat/ {
            proxy_pass http://chat_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }

        # ===== Delivery API (JWT required) =====
        location /api/delivery/ {
            proxy_pass http://delivery_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # JWT authentication via Lua
            access_by_lua_file /etc/nginx/jwt-auth.lua;

            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }

        # ===== Payment API =====
        location /api/payment/ {
            proxy_pass http://payment_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }

        # ===== Health endpoint (no auth) =====
        location /health {
            proxy_pass http://auth_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }
    }
}
