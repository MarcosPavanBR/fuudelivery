name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Commit SHA para deploy manual (padrao: HEAD da branch)"
        required: false
        type: string

jobs:
  # Gate: só permite deploy se o CI Gate passou (ou em disparo manual).
  # Este job SEMPRE roda; se o CI falhou, falha o pipeline e bloqueia o deploy.
  check-ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica resultado do CI Gate
        if: ${{ github.event_name != 'workflow_dispatch' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI workflow did not pass (conclusion: ${{ github.event.workflow_run.conclusion }})."
          echo "Fix CI failures before deploying."
          exit 1

  deploy-all:
    needs: [check-ci-status]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api
            service_id_secret: RENDER_SERVICE_ID_API
          - name: web
            service_id_secret: RENDER_SERVICE_ID_WEB
          - name: admin
            service_id_secret: RENDER_SERVICE_ID_ADMIN
    steps:
      - name: Garante rotas SPA (web/admin) antes do deploy
        if: matrix.service.name != 'api'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets[matrix.service.service_id_secret] }}
        run: |
          # O deploy via API (POST /deploys) nao sincroniza config de servico.
          # Garante o rewrite SPA (/* -> /index.html) antes de rebuildar,
          # para as rotas nunca ficarem dessincronizadas do render.yaml.
          curl -sS -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '[{"type":"rewrite","source":"/*","destination":"/index.html"}]' \
            -w "\nHTTP %{http_code}\n" \
            "https://api.render.com/v1/services/${SERVICE_ID}/routes"

      - name: Deploy ${{ matrix.service.name }} to Render
        run: |
          DEPLOY_BODY="{}"
          COMMIT_ID="${{ github.event.inputs.commit_id }}"
          if [ -n "$COMMIT_ID" ]; then
            DEPLOY_BODY="{\"commitId\":\"${COMMIT_ID}\"}"
            echo "Deployando commit especifico: $COMMIT_ID"
          fi
          # POST /deploys pode falhar transitoriamente (rate limit/flake da API
          # do Render). Tenta ate 3x com o codigo HTTP visivel; aceita 200/201
          # (criado, corpo com o deploy) e 202 (fila/queued, sem corpo).
          RESP=""
          HTTP_CODE=""
          for attempt in 1 2 3; do
            OUT=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$DEPLOY_BODY" \
              "https://api.render.com/v1/services/${{ secrets[matrix.service.service_id_secret] }}/deploys" 2>&1 || true)
            HTTP_CODE=$(echo "$OUT" | tail -1)
            RESP=$(echo "$OUT" | sed '$d')
            echo "[$attempt/3] POST /deploys (${{ matrix.service.name }}) -> HTTP $HTTP_CODE"
            case "$HTTP_CODE" in
              200|201|202) break ;;
            esac
            sleep 5
          done
          echo "POST /deploys -> $RESP"
          DEPLOY_ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$DEPLOY_ID" ]; then
            # 202 "Queued" nao traz corpo - busca o deploy mais recente do servico
            echo "POST sem corpo (HTTP $HTTP_CODE) - buscando deploy mais recente..."
            DEPLOY_ID=$(curl -sS "https://api.render.com/v1/services/${{ secrets[matrix.service.service_id_secret] }}/deploys?limit=1" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)[0].get('deploy',{}).get('id',''))" 2>/dev/null || echo "")
          fi
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Falha ao obter o ID do deploy (${{ matrix.service.name }}, HTTP $HTTP_CODE): $RESP"
            exit 1
          fi
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Deploy iniciado: $DEPLOY_ID"

      - name: Aguarda e valida deploy ${{ matrix.service.name }} (GET /deploys)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets[matrix.service.service_id_secret] }}
          DEPLOY_ID: ${{ env.DEPLOY_ID }}
        run: |
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::DEPLOY_ID vazio - deploy nao iniciado"
            exit 1
          fi
          # Estaticos (web/admin) buildam em minutos; a API (Go) demora mais.
          # Timeout menor para os estaticos acelera o feedback do pipeline
          # sem cortar a API no meio do build.
          if [ "${{ matrix.service.name }}" = "api" ]; then
            MAX_ATTEMPTS=40
          else
            MAX_ATTEMPTS=16
          fi
          for i in $(seq 1 ${MAX_ATTEMPTS}); do
            STATUS=$(curl -sS "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "erro_ao_consultar")
            echo "[$i/${MAX_ATTEMPTS}] deploy $DEPLOY_ID (${{ matrix.service.name }}) status: $STATUS"
            case "$STATUS" in
              live)
                echo "::notice::Deploy $DEPLOY_ID (${{ matrix.service.name }}) concluido com sucesso"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy $DEPLOY_ID (${{ matrix.service.name }}) FALHOU (status: $STATUS)"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timeout aguardando o deploy $DEPLOY_ID (${{ matrix.service.name }}) concluir"
          exit 1

  # --------------------------------------------------------------
  # Health check pos-deploy: confirma que os servicos realmente
  # respondem apos ficarem live (o polling do deploy-all so confirma
  # o status "live" no Render, nao o HTTP de cada servico).
  # --------------------------------------------------------------
  health-check:
    name: Health check pos-deploy (API + paineis)
    needs: [deploy-all]
    runs-on: ubuntu-latest
    steps:
      - name: API /health (HTTP 200)
        run: |
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://fuudelivery-api-8y6l.onrender.com/health")
            echo "[$i/12] API /health -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::API /health nao respondeu 200 apos o deploy"
            exit 1
          fi

      - name: WebAdmin (HTTP 200)
        run: |
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://fuudelivery-admin-lv7f.onrender.com/")
            echo "[$i/12] WebAdmin / -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::WebAdmin nao respondeu 200 apos o deploy"
            exit 1
          fi

      - name: WebRestaurant (HTTP 200)
        run: |
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://fuudelivery-web.onrender.com/")
            echo "[$i/12] WebRestaurant / -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::WebRestaurant nao respondeu 200 apos o deploy"
            exit 1
          fi
  # --------------------------------------------------------------
  # Verificacao das rotas SPA (fecha o ciclo de auto-correcao):
  # o deploy-all ja GARANTE o rewrite via PUT antes de rebuildar;
  # este job confere (GET) que a regra /* -> /index.html esta de
  # fato aplicada apos o deploy, e quebra o pipeline se nao.
  # --------------------------------------------------------------
  verify-spa-routes:
    name: Verifica rotas SPA (web/admin)
    needs: [health-check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: web
            service_id_secret: RENDER_SERVICE_ID_WEB
          - name: admin
            service_id_secret: RENDER_SERVICE_ID_ADMIN
    steps:
      - name: Checkout (para o script check_spa_routes.py)
        uses: actions/checkout@v5
      - name: GET /routes e confere rewrite SPA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets[matrix.service.service_id_secret] }}
        run: |
          ROUTES=$(curl -sS "https://api.render.com/v1/services/${SERVICE_ID}/routes" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" 2>&1 || true)
          echo "GET /routes (${{ matrix.service.name }}) -> $ROUTES"
          echo "$ROUTES" | python3 scripts/check_spa_routes.py "${{ matrix.service.name }}"
