name: Build AppEntrega APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frontend/AppEntrega/**'
      - '.github/workflows/build-appentrega.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Sem isso o GitHub usa o default de 6h: em 07/09/2026 três runs
    # ficaram penduradas 60+ min no step do Gradle sem nunca falhar,
    # queimando minutos de Actions. Referência de tempo real: o step
    # inteiro do Gradle até o bundling leva ~9m40s.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Frontend/AppEntrega

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/AppEntrega/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild (gera projeto nativo)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EX_UPDATES_CHANNEL: preview

      - name: Build APK (Gradle)
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "expo.inlineModules.watchedDirectories=[]" >> android/gradle.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppEntrega-APK
          path: Frontend/AppEntrega/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
