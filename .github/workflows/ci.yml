name: CI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────
  # Go modules — matrix strategy
  # ──────────────────────────────────────────────
  go-modules:
    name: Go — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 60s

  # ──────────────────────────────────────────────
  # Integration — fluxo completo de pagamento PIX
  # (exige Docker + testcontainers: MongoDB + Postgres reais,
  #  AbacatePay mockado por httptest.Server)
  # ──────────────────────────────────────────────
  integration-payments:
    name: Integration — fluxo PIX (auth→order→payment→split→wallet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/fuudelivery
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run integration tests (testcontainers)
        run: go test -tags=integration -v -timeout 20m -run 'TestFullFlow|TestErrorScenarios|TestAdminBootstrap' ./

  # ──────────────────────────────────────────────
  # Integration — payment_api (checkout E2E + admin Financeiro)
  # (exige Docker + testcontainers MongoDB real)
  # ──────────────────────────────────────────────
  integration-payment-api:
    name: Integration — payment_api (checkout + admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/payment_api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run payment_api integration tests (testcontainers)
        run: go test -tags=integration -v -timeout 20m -run 'TestCheckoutE2E' ./app/handlers/

  # ──────────────────────────────────────────────
  # Formatting — all Go modules
  # ──────────────────────────────────────────────
  lint:
    name: Lint — gofmt (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l -s Backend/ cmd/)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Vulnerability scanning — all Go modules
  # ──────────────────────────────────────────────
  govulncheck:
    name: govulncheck — ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install govulncheck
        # v1.1.4 compativel com Go 1.24+ (v1.2.0+ exige go >= 1.25)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # Mobile — API URL consistency (URLS.md vs config/api.ts)
  # ──────────────────────────────────────────────
  check-mobile-urls:
    name: Check mobile API URL consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run URL consistency check
        run: bash scripts/check-mobile-urls.sh

  # --------------------------------------------------------------
  # Regressao - regras CSS fora de @layer (bug do Tailwind v4)
  # No Tailwind v4, regra sem layer sempre vence qualquer layer,
  # anulando utilities (p-6, lg:ml-64...). Este job impede a volta.
  # --------------------------------------------------------------
  check-css-layers:
    name: Check CSS @layer (no unlayered rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run unlayered CSS check
        run: node scripts/check-unlayered-css.cjs Frontend/WebAdmin/src/index.css Frontend/WebRestaurant/src/index.css

  # ──────────────────────────────────────────────
  # Frontend — install, test, lint, build
  # ──────────────────────────────────────────────
  frontend-webrestaurant:
    name: Frontend — WebRestaurant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/WebRestaurant
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/WebRestaurant/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # vitest (substitui react-scripts test após a migração webpack → Vite)
        run: npm test

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # NPM Audit — all frontends
  # ──────────────────────────────────────────────
  npm-audit:
    name: NPM Audit — ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - Frontend/WebRestaurant
          - Frontend/WebAdmin
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        # --omit=dev ignora devDependencies; --audit-level=critical so falha
        # em vulnerabilidades criticas (moderate/high sao reportadas mas nao bloqueiam)
        run: npm audit --omit=dev --audit-level=critical
