name: Deploy to Render

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api
            hook_secret: RENDER_DEPLOY_HOOK_API
          - name: web
            hook_secret: RENDER_DEPLOY_HOOK_WEB
          - name: admin
            hook_secret: RENDER_DEPLOY_HOOK_ADMIN
          - name: payment
            hook_secret: RENDER_DEPLOY_HOOK_PAYMENT
          - name: payment-panel
            hook_secret: RENDER_DEPLOY_HOOK_PAYMENT_PANEL
    steps:
      - name: Deploy ${{ matrix.service.name }} to Render
        run: |
          curl -X POST "${{ secrets[matrix.service.hook_secret] }}"
