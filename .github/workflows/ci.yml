name: CI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────
  # Go modules — matrix strategy
  # ──────────────────────────────────────────────
  go-modules:
    name: Go — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/Payment
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 60s

  # ──────────────────────────────────────────────
  # Formatting — all Go modules
  # ──────────────────────────────────────────────
  lint:
    name: Lint — gofmt (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l -s Backend/ cmd/)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Vulnerability scanning — all Go modules
  # ──────────────────────────────────────────────
  govulncheck:
    name: govulncheck — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/Payment
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # Mobile — API URL consistency (URLS.md vs config/api.ts)
  # ──────────────────────────────────────────────
  check-mobile-urls:
    name: Check mobile API URL consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run URL consistency check
        run: bash scripts/check-mobile-urls.sh

  # ──────────────────────────────────────────────
  # Frontend — install, test, lint, build
  # ──────────────────────────────────────────────
  frontend-webrestaurant:
    name: Frontend — WebRestaurant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/WebRestaurant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/WebRestaurant/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # vitest (substitui react-scripts test após a migração webpack → Vite)
        run: npm test

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # NPM Audit — all frontends
  # ──────────────────────────────────────────────
  npm-audit:
    name: NPM Audit — ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - Frontend/WebRestaurant
          - Frontend/WebAdmin
          - Frontend/PaymentPanel
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=moderate
