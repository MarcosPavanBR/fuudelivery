name: CI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────
  # Go modules — matrix strategy
  # ──────────────────────────────────────────────
  go-modules:
    name: Go — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
          - pkg/health
          - pkg/queue
          - cmd/etl-payments
          - cmd/etl-orders
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # Alinhar com go.work/go.mod (1.25). govulncheck exige 1.25+.
          go-version: "1.25.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Go mod tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -timeout 60s

  # ──────────────────────────────────────────────
  # Integration — fluxo completo de pagamento PIX
  # (exige Docker: Postgres via "docker run"; AbacatePay mockado
  #  por httptest.Server)
  # ──────────────────────────────────────────────
  integration-payments:
    name: Integration — fluxo PIX (auth→order→payment→split→wallet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/fuudelivery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # Alinhar com go.work/go.mod (1.25). govulncheck exige 1.25+.
          go-version: "1.25.x"

      - name: Start Docker services (Postgres)
        run: |
          docker run -d --name pg-it -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=fuudelivery_staging postgres:16-alpine
          until docker exec pg-it psql -U test -d postgres -c 'SELECT 1' >/dev/null 2>&1; do sleep 1; done
          for i in $(seq 1 30); do
            if docker exec pg-it psql -U test -d postgres \
              -c "CREATE DATABASE it_fullflow" -c "CREATE DATABASE it_err_scenarios" -c "CREATE DATABASE it_admin_bootstrap"; then break; fi
            sleep 2
          done
          echo "Services ready."

      # Cada suíte roda isolada (database própria), replicando o isolamento
      # que os containers individuais garantiam antes do escape hatch.
      - name: Run TestFullFlow
        env:
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/it_fullflow?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 10m -run 'TestFullFlow' ./

      - name: Run TestErrorScenarios
        env:
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/it_err_scenarios?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 10m -run 'TestErrorScenarios' ./

      - name: Run TestAdminBootstrap
        env:
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/it_admin_bootstrap?sslmode=disable
        run: go test -tags=integration -v -count=1 -timeout 10m -run 'TestAdminBootstrap' ./

      - name: Cleanup Docker services
        if: always()
        run: docker rm -f pg-it 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Integration — payment_api (checkout E2E + admin Financeiro)
  # (exige Docker: Postgres via "docker run")
  # ──────────────────────────────────────────────
  integration-payment-api:
    name: Integration — payment_api (checkout + admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/payment_api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # Alinhar com go.work/go.mod (1.25). govulncheck exige 1.25+.
          go-version: "1.25.x"
          cache-dependency-path: Backend/payment_api/go.sum

      - name: Start Docker service (Postgres)
        # Mesmo padrão comprovado do job e2e-delivery: "docker run" cru +
        # pg_isready. O teste detecta POSTGRES_TEST_URI e conecta direto.
        run: |
          docker run -d --name pg-pay -p 5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=payment_e2e_test postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg-pay pg_isready -U test 2>/dev/null && break
            sleep 1
          done
          echo "Service ready."

      - name: Compile integration test
        env:
          GOWORK: "off"
        run: go test -tags=integration -c -o /dev/null ./app/handlers/

      - name: Wait for Postgres to settle
        run: |
          echo "Waiting 5s for Postgres..."
          sleep 5
          docker exec pg-pay pg_isready -U test

      - name: Run payment_api integration tests
        env:
          POSTGRES_TEST_URI: postgres://test:test@localhost:5432/payment_e2e_test?sslmode=disable
        run: |
          set +e  # Don't exit on first error — capture everything
          echo "=== DEBUG: Environment ==="
          echo "Go version: $(go version)"
          echo "Docker ps:"
          docker ps --format "table {{.Names}}	{{.Status}}	{{.Ports}}"
          echo "Docker logs pg-pay (last 5 lines):"
          docker logs pg-pay --tail 5 2>&1 || echo "(no logs)"
          echo "POSTGRES_TEST_URI=$POSTGRES_TEST_URI"
          echo "GOWORK=${GOWORK:-<not set>}"
          echo "=== END DEBUG ==="
          echo ""
          echo "=== Running integration tests ==="
          go test -tags=integration -v -count=1 -timeout 20m -run 'TestCheckoutE2E' ./app/handlers/ 2>&1 | tee /tmp/test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Test exit code: $TEST_EXIT ==="
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT

      - name: Write test output to step summary
        if: always()
        run: |
          echo '## payment_api integration test output' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Docker Postgres logs' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker logs pg-pay --tail 20 2>&1 >> "$GITHUB_STEP_SUMMARY" || echo "(container not available)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Test output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/test-output.txt ]; then
            cat /tmp/test-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test output file found"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-api-test-output
          path: /tmp/test-output.txt
          retention-days: 3

      - name: Cleanup Docker services
        if: always()
        run: docker rm -f pg-pay 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Formatting — all Go modules
  # ──────────────────────────────────────────────
  lint:
    name: Lint — gofmt (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # Alinhar com go.work/go.mod (1.25). govulncheck exige 1.25+.
          go-version: "1.25.x"

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l -s Backend/ cmd/ pkg/)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Vulnerability scanning — all Go modules
  # ──────────────────────────────────────────────
  govulncheck:
    name: govulncheck — ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/fuudelivery
          - Backend/auth_api
          - Backend/payment_api
          - Backend/orders_api
          - Backend/delivery_api
          - Backend/chat_api
          - pkg/health
          - pkg/queue
          - cmd/etl-payments
          - cmd/etl-orders
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # govulncheck v1.2.0+ exige Go 1.25+
          go-version: "1.25.x"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # Mobile — API URL consistency (URLS.md vs config/api.ts)
  # ──────────────────────────────────────────────
  check-mobile-urls:
    name: Check mobile API URL consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run URL consistency check
        run: bash scripts/check-mobile-urls.sh

  # --------------------------------------------------------------
  # Regressao - regras CSS fora de @layer (bug do Tailwind v4)
  # No Tailwind v4, regra sem layer sempre vence qualquer layer,
  # anulando utilities (p-6, lg:ml-64...). Este job impede a volta
  # em TODOS os CSS customizados do repo (scan automático).
  # --------------------------------------------------------------
  check-css-layers:
    name: Check CSS @layer (no unlayered rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checker unit test
        run: node scripts/check-unlayered-css.test.cjs

      - name: Run unlayered CSS check
        run: node scripts/check-unlayered-css.cjs

  # ──────────────────────────────────────────────
  # Workflows — YAML válido + sintaxe bash dos run blocks
  # ──────────────────────────────────────────────
  check-workflows:
    name: Check workflow YAML + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checker self-test
        run: python3 scripts/check-workflows.py --self-test

      - name: Validate all workflow files + script refs
        run: python3 scripts/check-workflows.py --repo-root .

  # ──────────────────────────────────────────────
  # Frontend — install, test, lint, build
  # ──────────────────────────────────────────────
  frontend-webrestaurant:
    name: Frontend — WebRestaurant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/WebRestaurant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/WebRestaurant/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # vitest (substitui react-scripts test após a migração webpack → Vite)
        run: npm test

      - name: Build
        run: npm run build

  frontend-webadmin:
    name: Frontend — WebAdmin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/WebAdmin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/WebAdmin/package-lock.json

      - name: Install dependencies
        # legacy-peer-deps: mesmo padrão do buildCommand do render.yaml
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # NPM Audit — all frontends
  # ──────────────────────────────────────────────
  npm-audit:
    name: NPM Audit — ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - Frontend/WebRestaurant
          - Frontend/WebAdmin
          - Frontend/AppComida
          - Frontend/AppEntrega
          - Frontend/AppRestaurante
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        # --omit=dev ignora devDependencies; --audit-level=critical so falha
        # em vulnerabilidades criticas (moderate/high sao reportadas mas nao bloqueiam).
        # Retry 3x com backoff: o registry.npmjs.org retorna 503 intermitente.
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=critical; then
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 15s..."
            sleep 15
          done
          echo "All 3 attempts failed"
          exit 1

  # ──────────────────────────────────────────────
  # Shell scripts — portabilidade + bugs comuns
  # ──────────────────────────────────────────────
  check-shellcheck:
    name: ShellCheck — scripts .sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on all .sh scripts
        # -S warning: bloqueia warnings e errors, ignora style/info.
        # --exclude=SC1091: sourcing de arquivos externos (e.g. .env)
        #   nao e verificavel no CI sem o target real.
        run: |
          scripts=$(find scripts sql -name '*.sh' -type f 2>/dev/null || true)
          if [ -z "$scripts" ]; then
            echo "No .sh files found, skipping."
            exit 0
          fi
          echo "Checking: $scripts"
          shellcheck -S warning --exclude=SC1091 $scripts

  # ──────────────────────────────────────────────
  # Delivery E2E — dual-write PG+Mongo via testcontainers
  # ──────────────────────────────────────────────
  e2e-delivery:
    name: E2E — Delivery (dual-write)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIXADO em 1.25.x, igual aos demais jobs (ver comentário na matriz go-modules).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: cmd/fuudelivery/go.sum

      - name: Start Docker services (Postgres)
        run: |
          docker run -d --name pg-e2e -p 5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=fuudelivery_delivery postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg-e2e pg_isready -U test 2>/dev/null && break
            sleep 1
          done
          echo "Services ready."

      - name: Run Delivery E2E tests
        working-directory: cmd/fuudelivery
        run: |
          go test -tags=integration -v -count=1 -timeout=5m \
            -run 'TestDeliveryLifecycle|TestDeliverySolicitationsDualWrite' \
            .

      - name: Cleanup Docker services
        if: always()
        run: docker rm -f pg-e2e 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Mobile — TypeScript type-check + tests
  # ──────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile — ${{ matrix.app }} (tsc + jest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Frontend/AppEntrega
          - Frontend/AppComida
          - Frontend/AppRestaurante
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --passWithNoTests --forceExit
