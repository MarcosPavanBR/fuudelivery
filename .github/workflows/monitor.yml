# monitor.yml — Scheduled production health checks
#
# Roda o verify-deploy.sh contra a produção. O job FALHA quando algum serviço
# está fora do ar (o exit code do script é a contagem de falhas), o que aparece
# como run vermelha no Actions. workflow_dispatch permite checar sob demanda.
#
# ATENÇÃO — A CADÊNCIA REAL NÃO É A DECLARADA.
#
# O cron abaixo pede 30 minutos. Medindo os 99 intervalos entre as execuções
# agendadas de 26/08 a 10/09:
#
#   mínimo    47 min
#   mediana  212 min  (3h32)
#   média    228 min
#   máximo   776 min  (quase 13 horas)
#
# NENHUM dos 99 intervalos chegou perto de 30 minutos. O GitHub despriorizA
# schedules de alta frequência em runners compartilhados e atrasa ou descarta
# execuções sob carga — comportamento documentado, não bug deste repositório.
#
# Consequência prática: este workflow é uma REDE DE SEGURANÇA, não um alarme.
# A produção pode ficar fora do ar por horas antes de ele rodar. Para
# monitoramento de verdade (checagem a cada 1-5 min e notificação no celular),
# use um serviço externo apontando para /health — o endpoint /metrics já existe
# com METRICS_TOKEN justamente para UptimeRobot/BetterStack/Grafana.
name: Monitor Production

on:
  schedule:
    # Every 30 minutes — Render free-tier cold starts can take 30-60s,
    # so verify-deploy.sh already retries 3x with 10s intervals.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    # O check da API agora espera até API_BUDGET (180s) pelo cold start, então
    # o job pode levar alguns minutos. O teto existe pela lição do lintVital:
    # job sem timeout que trava fica pendurado até o limite da conta.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run verify-deploy.sh
        id: verify
        # Script prints a summary per service and exits with the number of failures.
        # `|| true` keeps the run green here so we can still emit the summary;
        # the final step below converts an unhealthy state into a failed job.
        run: |
          set +e
          bash scripts/verify-deploy.sh 2>&1 | tee verify-output.txt
          FAILURES=${PIPESTATUS[0]}
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload health check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-check-log
          path: verify-output.txt
          retention-days: 7

      - name: Fail job if services unhealthy
        if: steps.verify.outputs.failures != '0'
        run: |
          echo "::error::One or more production services are unhealthy (exit code ${{ steps.verify.outputs.failures }})"
          cat verify-output.txt
          exit 1
