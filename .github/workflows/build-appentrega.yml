name: Build AppEntrega APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frontend/AppEntrega/**'
      - '.github/workflows/build-appentrega.yml'

# Token do GITHUB_TOKEN só lê: nenhum job deste workflow escreve no repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 60 min: a COMPILAÇÃO leva ~19 min (medido na run 169), então isto é
    # 3x de folga. Serve de rede contra travamento, não de meta.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Frontend/AppEntrega

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/AppEntrega/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Prebuild (gera projeto nativo)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EX_UPDATES_CHANNEL: preview

      # Cache do Gradle: sem ele cada run rebaixa o distributivo, os plugins e
      # todo o cache de build do zero. Chave por lockfile do app + arquivos de
      # build do Android; o restore-keys aproveita o cache anterior quando só
      # uma dependência muda.
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-appentrega-${{ hashFiles('Frontend/AppEntrega/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-appentrega-

      - name: Build APK (Gradle)
        run: |
          # -Xmx3g, não 4g: o runner tem ~7GB e o build sobe MAIS de uma JVM
          # (Gradle + daemon do Kotlin) além dos compiladores nativos do NDK.
          # Com 4g o conjunto encosta no limite e o runner entra em swap, que
          # é exatamente o quadro de "trava sem erro" visto nas runs 156/158.
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          # Runner do GitHub tem 2 núcleos. Sem o teto, o Gradle dispara mais
          # workers do que há CPU e os compiladores nativos disputam memória.
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          # Ver bae98ee: sem valor explícito, o Gradle "achata" a lista vazia
          # do plugin de autolinking e o CLI morre com "argument missing".
          echo "expo.inlineModules.watchedDirectories=[]" >> android/gradle.properties
          cd android
          chmod +x gradlew
          # DUAS ABIs em vez de quatro. Este é o item que destrava o build.
          #
          # O padrão do prebuild é armeabi-v7a,arm64-v8a,x86,x86_64 — com
          # newArchEnabled=true (codegen C++) mais worklets, nitro-modules,
          # mmkv e maplibre, o compilador nativo roda o projeto inteiro
          # QUATRO vezes. A run 156 bateu no teto de 6 HORAS do GitHub sem
          # terminar; a 158 morreu no timeout de 45 min.
          #
          # x86 e x86_64 só servem para EMULADOR. Para um APK que vai ser
          # instalado em celular de verdade, arm64-v8a cobre praticamente todo
          # aparelho atual e armeabi-v7a cobre os antigos. Se algum dia for
          # preciso rodar no emulador, é só acrescentar x86_64 aqui.
          # -x nas tarefas de lintVital: é ELAS que travavam o build.
          #
          # O log da run 169 mostra a coisa inteira compilando em 19 min
          # (dexBuilderRelease, mergeDexRelease, compileReleaseArtProfile — o
          # APK estava praticamente pronto às 18:04). Aí
          # :react-native-masked-view e :react-native-async-storage falharam em
          # lintVitalAnalyzeRelease e o Gradle ficou 101 MINUTOS em silêncio,
          # sem uma linha de log, até o job ser cancelado (o cleanup ainda
          # matou dois aapt2 órfãos). Não era build lento — era o lint pendurado
          # no caminho de falha.
          #
          # lintVital é checagem de qualidade que a AGP roda no build de
          # release; não é requisito para gerar APK. E o que falhou está em
          # node_modules de terceiros, não no código deste projeto — travar a
          # entrega do app por isso seria o rabo abanando o cachorro.
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            --build-cache --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppEntrega-APK
          path: Frontend/AppEntrega/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
