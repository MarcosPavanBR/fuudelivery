name: Delete Unused Render Services

on:
  workflow_dispatch:

jobs:
  delete-services:
    runs-on: ubuntu-latest
    steps:
      - name: Deletar fuudelivery-payment (microserviço isolado)
        run: |
          curl -s -o /dev/null -w "payment: %{http_code}\n" \
            -X DELETE \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/srv-d9gego3rjlhs739jgrfg"

      - name: Deletar fuudelivery-payment-panel (frontend isolado)
        run: |
          curl -s -o /dev/null -w "payment-panel: %{http_code}\n" \
            -X DELETE \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/srv-d9gemgepbkes73cjqqg0"

      - name: Listar serviços restantes
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?limit=100" | \
            jq -r '.[].service | "\(.id) | \(.name) | \(.serviceDetails.url // "no-url")"' | sort
