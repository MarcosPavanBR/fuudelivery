name: Fix Admin SPA Routes

on:
  workflow_dispatch:

jobs:
  apply-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Aplica rewrite SPA no servico admin
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_ADMIN }}
        run: |
          echo "== PATCH /v1/services (routes) =="
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"routes":[{"type":"rewrite","source":"/*","destination":"/index.html"}]}' \
            -w "\nHTTP %{http_code}\n" \
            "https://api.render.com/v1/services/${SERVICE_ID}"

          echo "== POST /v1/services/deploys (admin) =="
          curl -sS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\nHTTP %{http_code}\n" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys"
