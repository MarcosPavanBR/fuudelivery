name: Fetch Render logs (temp)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-env-check.yml'
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch recent logs
        env:
          RKEY: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ secrets.RENDER_SERVICE_ID_API }}
        run: |
          echo "=== attempt 1: /logs?limit=300 ==="
          curl -s -i -H "Authorization: Bearer $RKEY" \
            "https://api.render.com/v1/services/$SID/logs?limit=300" | head -c 800
          echo
          echo "=== attempt 2: /logs?limit=50&startTime=2026-08-12T15:25:00Z ==="
          curl -s -i -H "Authorization: Bearer $RKEY" \
            "https://api.render.com/v1/services/$SID/logs?limit=50&startTime=2026-08-12T15%3A25%3A00Z" | head -c 800
