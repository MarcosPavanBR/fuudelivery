name: Set Payment Mongo DB env (temp)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-env-check.yml'
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set PAYMENT_MONGO_DATABASE on api service
        env:
          RKEY: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ secrets.RENDER_SERVICE_ID_API }}
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer $RKEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$SID/env-vars" \
            -d '{"envVars":[{"key":"PAYMENT_MONGO_DATABASE","value":"fuudelivery_payments"}]}' > /tmp/resp.json
          echo "bytes: $(wc -c < /tmp/resp.json)"
          head -c 800 /tmp/resp.json
          echo
          # confirma
          curl -s -H "Authorization: Bearer $RKEY" \
            "https://api.render.com/v1/services/$SID/env-vars" | grep -o '"PAYMENT_MONGO_DATABASE"' | head -1 || echo "NOT FOUND"
