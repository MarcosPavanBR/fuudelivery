# monitor.yml — Scheduled production health checks
#
# Runs verify-deploy.sh against the live FuuDelivery services every 30 minutes.
# The job FAILS whenever any service is unhealthy (script exit code = failure count),
# which surfaces as a red run in GitHub Actions and can be wired to notifications.
# A workflow_dispatch trigger allows on-demand checks from the Actions tab.
name: Monitor Production

on:
  schedule:
    # Every 30 minutes — Render free-tier cold starts can take 30-60s,
    # so verify-deploy.sh already retries 3x with 10s intervals.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run verify-deploy.sh
        id: verify
        # Script prints a summary per service and exits with the number of failures.
        # `|| true` keeps the run green here so we can still emit the summary;
        # the final step below converts an unhealthy state into a failed job.
        run: |
          set +e
          bash scripts/verify-deploy.sh 2>&1 | tee verify-output.txt
          FAILURES=${PIPESTATUS[0]}
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload health check log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: health-check-log
          path: verify-output.txt
          retention-days: 7

      - name: Fail job if services unhealthy
        if: steps.verify.outputs.failures != '0'
        run: |
          echo "::error::One or more production services are unhealthy (exit code ${{ steps.verify.outputs.failures }})"
          cat verify-output.txt
          exit 1

  # Notificacao de falha: o monitor roda agendado, entao ninguem ve o
  # run vermelho — avisa Slack/Discord/e-mail quando algum servico
  # ficar unhealthy. Canais opcionais via secrets (SLACK_WEBHOOK_URL /
  # DISCORD_WEBHOOK_URL / SMTP_*); sem nenhum, apenas loga warning.
  notify-failure:
    name: Notifica falha de saude
    if: failure()
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (para scripts/notify-failure.sh)
        uses: actions/checkout@v5

      - name: Envia notificacao de falha
        continue-on-error: true
        env:
          NOTIFY_TITLE: "🔴 Servico unhealthy — fuudelivery (run #${{ github.run_number }})"
          NOTIFY_TEXT: "${{ github.workflow }} — health check falhou (servicos fora do ar ou degradados)."
          NOTIFY_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOTIFY_SHA: "${{ github.sha }}"
          NOTIFY_REF: "${{ github.ref }}"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: bash scripts/notify-failure.sh
