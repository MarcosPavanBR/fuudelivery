name: List Render Services

on:
  workflow_dispatch:

jobs:
  list-services:
    runs-on: ubuntu-latest
    steps:
      - name: Listar serviços do Render
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?limit=100" | \
            jq -r '.[] | "\(.id) | \(.name) | \(.serviceDetails.url // "no-url") | \(.type)"' | sort
